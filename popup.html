<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Git Slider</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="brand">
        <div class="brand__mark" aria-hidden="true">
          <span class="brand__rail"></span>
          <span class="brand__knob"></span>
        </div>
        <div>
          <p class="eyebrow">QUEUE NAVIGATOR</p>
          <h1>Git Slider</h1>
        </div>
        <span class="live-dot" title="Extension ready"></span>
      </header>

      <section class="context" aria-live="polite">
        <span id="context-kind" class="context__kind">GITHUB</span>
        <div>
          <p id="context-repo">Open an issue or pull request</p>
          <strong id="context-number">Ready when you are</strong>
        </div>
      </section>

      <section class="controls" aria-label="Navigation controls">
        <button type="button" data-direction="previous" disabled>
          <span class="arrow" aria-hidden="true">←</span>
          <span><small>PREVIOUS OPEN</small><strong>Older</strong></span>
          <kbd>[</kbd>
        </button>
        <button type="button" data-direction="next" disabled>
          <span><small>NEXT OPEN</small><strong>Newer</strong></span>
          <kbd>]</kbd>
          <span class="arrow" aria-hidden="true">→</span>
        </button>
      </section>

      <p id="status" class="status" role="status">Works on GitHub issue and PR pages.</p>

      <footer>
        <span><kbd>⌥</kbd><kbd>⇧</kbd><kbd>←</kbd> / <kbd>→</kbd> work globally</span>
        <button id="shortcuts" type="button">Edit shortcuts</button>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
