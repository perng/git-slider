<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Git Slider</title>
    <link rel="stylesheet" href="../popup.css">
  </head>
  <body>
    <main>
      <header class="brand"><div class="brand__mark" aria-hidden="true"><span class="brand__rail"></span><span class="brand__knob"></span></div><div><p class="eyebrow">QUEUE NAVIGATOR</p><h1>Git Slider</h1></div><span class="live-dot"></span></header>
      <section class="context"><span class="context__kind">ISSUE</span><div><p>isaacs/github</p><strong>#366 · open queue</strong></div></section>
      <section class="controls">
        <button type="button"><span class="arrow">←</span><span><small>PREVIOUS OPEN</small><strong>Older</strong></span><kbd>[</kbd></button>
        <button type="button"><span><small>NEXT OPEN</small><strong>Newer</strong></span><kbd>]</kbd><span class="arrow">→</span></button>
      </section>
      <p class="status">Choose a direction. Closed items are skipped.</p>
      <footer><span><kbd>ALT</kbd><kbd>⇧</kbd><kbd>←</kbd> / <kbd>→</kbd> work globally</span><button type="button">Edit shortcuts</button></footer>
    </main>
  </body>
</html>
